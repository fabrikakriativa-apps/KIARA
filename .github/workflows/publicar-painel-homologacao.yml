name: Publicar painel Kiara (homologação isolada)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: painel-kiara-homologacao
  cancel-in-progress: true
jobs:
  deploy_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir variáveis da homologação
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_5R2zVzcZQVAGGd72zXayFQ_zCp_tJkU
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Token Cloudflare ausente"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Conta Cloudflare ausente"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Chave publicável Supabase ausente"; exit 1; }
      - name: Instalar e compilar painel isolado
        working-directory: painel
        env:
          KIARA_BASE_PATH: /
          VITE_SUPABASE_URL: https://dpowbyexrcdcwwqysgzp.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_5R2zVzcZQVAGGd72zXayFQ_zCp_tJkU
          VITE_KIARA_PRICE_SIMULATION_URL: ""
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Criar projeto exclusivo se necessário
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project list --json > projects.json
          if ! node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("projects.json","utf8"));process.exit(x.some(p=>p.name==="kiara-painel-homologacao")?0:1)'; then
            npx --yes wrangler@4 pages project create kiara-painel-homologacao --production-branch feat/painel-independente
          fi
      - name: Publicar apenas o projeto separado de homologação
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy painel/dist --project-name kiara-painel-homologacao --branch feat/painel-independente
