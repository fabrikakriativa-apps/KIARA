name: Publicar painel Kiara (homologação isolada)
on:
  workflow_dispatch:
  push:
    branches: [feat/painel-independente]
    paths:
      - '.github/kiara-homologacao-deploy-request.txt'
permissions:
  contents: read
concurrency:
  group: painel-kiara-homologacao
  cancel-in-progress: true
jobs:
  deploy_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir variáveis da homologação
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_5R2zVzcZQVAGGd72zXayFQ_zCp_tJkU
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Token Cloudflare ausente"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Conta Cloudflare ausente"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Chave publicável Supabase ausente"; exit 1; }
      - name: Instalar e compilar painel isolado
        working-directory: painel
        env:
          KIARA_BASE_PATH: /
          VITE_SUPABASE_URL: https://dpowbyexrcdcwwqysgzp.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_5R2zVzcZQVAGGd72zXayFQ_zCp_tJkU
          VITE_KIARA_CONTROL_URL: https://fabrika-atendimento-ia-homologacao.fabrikakriativa.workers.dev/kiara/control
          VITE_KIARA_COACH_URL: https://fabrika-atendimento-ia-homologacao.fabrikakriativa.workers.dev/kiara/coach
          VITE_KIARA_HUMAN_MESSAGE_URL: https://fabrika-atendimento-ia-homologacao.fabrikakriativa.workers.dev/kiara/human-message
          VITE_KIARA_PRICE_SIMULATION_URL: https://fabrika-atendimento-ia-homologacao.fabrikakriativa.workers.dev/kiara/pricing/simulate
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Publicar apenas o projeto separado de homologação
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy painel/dist --project-name kiara-painel-homologacao --branch feat/painel-independente

      - name: Verificar rotas públicas do Worker de homologação (sem credenciais)
        env:
          WORKER_URL: https://fabrika-atendimento-ia-homologacao.fabrikakriativa.workers.dev
          PANEL_ORIGIN: https://kiara-painel-homologacao.pages.dev
        run: |
          for route in /kiara/control /kiara/coach /kiara/pricing/simulate /kiara/human-message; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS -H "Origin: $PANEL_ORIGIN" "$WORKER_URL$route")
            echo "$route → HTTP $status"
            if [ "$status" != "204" ]; then
              echo "::error::Worker de homologação não disponibiliza $route. É preciso atualizar o Worker e as flags de operação antes do teste."
              exit 1
            fi
          done
