name: Kiara - liberar exclusivamente contato autorizado apos falso encaminhamento
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recuperar-contato-teste-kiara.yml']
permissions:
  contents: read
jobs:
  liberar-kv:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Excluir somente trava KV do contato autorizado de teste
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,urllib.parse,sys
          token=os.environ['CF_TOKEN']; acct=os.environ['CF_ACCOUNT']
          base=f'https://api.cloudflare.com/client/v4/accounts/{acct}'
          headers={'Authorization':'Bearer '+token}
          def request(url,method='GET'):
            req=urllib.request.Request(url,headers=headers,method=method)
            try:
              with urllib.request.urlopen(req,timeout=30) as resp:return resp.status,resp.read()
            except urllib.error.HTTPError as err:return err.code,err.read()
          status,payload=request(base+'/workers/scripts/fabrika-atendimento-ia/settings')
          if status!=200:sys.exit('Falha na consulta de configuracao do Worker')
          obj=json.loads(payload)
          if not obj.get('success'):sys.exit('Configuracao indisponivel')
          b={item.get('name'):item for item in obj['result']['bindings']}
          if b.get('EASY_PHONE_NUMBER_ID',{}).get('text')!='989677610885915':sys.exit('Bloqueado: Business diferente')
          raw=b.get('TEST_ALLOWED_WA_ID',{}).get('text','')
          sender=''.join(ch for ch in raw if ch.isdigit())
          if not sender.endswith('5185') or len(sender) not in (12,13):sys.exit('Bloqueado: contato diferente')
          if b.get('KIARA_ADS_ROUTING_ENABLED',{}).get('text')=='true':sys.exit('Bloqueado: campanha requer validacao adicional')
          kv=b.get('CONVERSAS',{})
          ns=kv.get('namespace_id') or kv.get('id')
          if kv.get('type')!='kv_namespace' or not ns:sys.exit('Namespace de controle nao encontrado')
          key='easy:'+sender+':human'
          url=base+'/storage/kv/namespaces/'+urllib.parse.quote(ns,safe='')+'/values/'+urllib.parse.quote(key,safe='')
          result,body=request(url,'DELETE')
          if result not in (200,204):sys.exit('Nao foi possivel liberar o KV; acesso insuficiente ou erro HTTP '+str(result))
          if body:
            try:
              if json.loads(body).get('success') is False:sys.exit('API recusou liberacao')
            except ValueError:pass
          check,_=request(url)
          if check!=404:sys.exit('Nao foi possivel confirmar remocao da trava KV')
          print('Trava KV do contato autorizado de teste removida; demais contatos intactos.')
          PY
