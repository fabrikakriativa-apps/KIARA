# Atendimento consultivo: explicar benefícios e orientar sem exigir escolha imediata.

# Ajuste de linguagem: tom consultivo, nome discreto e perguntas apenas quando necessárias.

# Adaptação consultiva por contexto, benefícios relevantes sem roteiros ou classificação rígida.

# Atendimento natural: guardar dados sem eco repetido e resumir especificações uma vez antes do orçamento.

# Evitar confundir propostas anteriores com escolhas confirmadas em novos pedidos consultivos.

# Melhorar retorno acolhedor à correção e confirmar com tato se uma opção anterior ainda interessa.

# Homologação consultiva: publicar versão testada no contato Business autorizado após avaliação real e CI aprovado.

