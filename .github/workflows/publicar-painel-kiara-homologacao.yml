name: Publicar painel Kiara - homologação (isolado)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-painel-kiara-homologacao.yml'
permissions:
  contents: read
concurrency:
  group: kiara-painel-homologacao-publicacao
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/painel-independente
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar credenciais de publicação (sem expor valores)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Compilar painel de homologação separado
        working-directory: painel
        env:
          KIARA_BASE_PATH: /
          VITE_SUPABASE_URL: https://dpowbyexrcdcwwqysgzp.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_5R2zVzcZQVAGGd72zXayFQ_zCp_tJkU
          VITE_KIARA_CONTROL_URL: https://fabrika-atendimento-ia-homologacao.fabrikakriativa.workers.dev/kiara/control
          VITE_KIARA_COACH_URL: https://fabrika-atendimento-ia-homologacao.fabrikakriativa.workers.dev/kiara/coach
          VITE_KIARA_PRICE_SIMULATION_URL: https://fabrika-atendimento-ia-homologacao.fabrikakriativa.workers.dev/kiara/pricing/simulate
          VITE_KIARA_HUMAN_MESSAGE_URL: https://fabrika-atendimento-ia-homologacao.fabrikakriativa.workers.dev/kiara/human-message
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Publicar exclusivamente Cloudflare Pages de homologação
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy painel/dist --project-name kiara-painel-homologacao --branch feat/painel-independente
      - name: Comprovar disponibilidade das rotas do Worker
        env:
          ORIGIN: https://kiara-painel-homologacao.pages.dev
        run: |
          for route in /kiara/control /kiara/coach /kiara/pricing/simulate /kiara/human-message; do
            code=$(curl -sS -L -o /dev/null -w '%{http_code}' -X OPTIONS -H "Origin: $ORIGIN" "https://fabrika-atendimento-ia-homologacao.fabrikakriativa.workers.dev$route")
            echo "$route status $code"
            test "$code" = 204 || { echo "::error::Worker sem rota $route. Publicação do Worker necessária."; exit 1; }
          done
