name: Diagnosticar endpoint da homologacao (sem deploy)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnosticar-homologacao.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir resposta pública sem credenciais
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          u='https://fabrika-atendimento-ia-homologacao.fabrikakriativa.workers.dev/health'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 Kiara-Staging-Healthcheck','Accept':'application/json'})
          try:
            with urllib.request.urlopen(req,timeout=20) as response:
              status=response.status
              body=response.read(350).decode('utf-8','replace')
              headers=response.headers
          except urllib.error.HTTPError as error:
            status=error.code;body=error.read(350).decode('utf-8','replace');headers=error.headers
          print('HTTP status:',status)
          print('server:',headers.get('server'))
          print('cf-ray present:',bool(headers.get('cf-ray')))
          print('cf-mitigated:',headers.get('cf-mitigated'))
          print('www-authenticate:',headers.get('www-authenticate'))
          print('content-type:',headers.get('content-type'))
          print('body prefix:',repr(body[:250]))
          PY
      - name: Conferir deploy no plano de controle Cloudflare
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          a=os.environ['CF_ACCOUNT'];t=os.environ['CF_TOKEN']
          url=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/scripts'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+t})
          with urllib.request.urlopen(req,timeout=25) as response: data=json.load(response)
          workers=[x.get('id') for x in data.get('result',[]) if isinstance(x,dict)]
          print('Staging registered:', 'fabrika-atendimento-ia-homologacao' in workers)
          print('Production registered:', 'fabrika-atendimento-ia' in workers)
          PY
