name: Kiara - auditoria canal existente de testes (sem alteracoes)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/auditar-canal-easy-existente.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verificar nomes de credenciais e flags sem exibir dados
        run: |
          python3 - <<'PY'
          import os,urllib.request,json
          token=os.environ.get('CF_TOKEN','')
          account=os.environ.get('CF_ACCOUNT','')
          url='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/fabrika-atendimento-ia/settings'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=25) as response:
            bindings=json.load(response)['result']['bindings']
          names={b.get('name') for b in bindings}
          print('Worker existente encontrado. Apenas presença, nenhum valor de segredo:')
          for n in ['EASY_PHONE_NUMBER_ID','EASY_ACCESS_TOKEN','EASY_WEBHOOK_KEY','TEST_ALLOWED_WA_ID','META_VERIFY_TOKEN','OPENAI_API_KEY','SUPABASE_SERVICE_ROLE_KEY','KIARA_QUEUE','CONVERSAS']:
            print(n, 'PRESENTE' if n in names else 'AUSENTE')
          for n in ['KIARA_CONTROL_ENABLED','KIARA_SYNC_ENABLED','KIARA_HOLD_ENABLED','KIARA_SYNC_ALL_CONTACTS','KIARA_HUMAN_SEND_ENABLED']:
            b=next((x for x in bindings if x.get('name')==n),{})
            value=b.get('text') if b.get('type')=='plain_text' else None
            print(n, value if value in ('true','false') else 'nao configurado')
          phone=next((b for b in bindings if b.get('name')=='EASY_PHONE_NUMBER_ID'),{})
          print('Numero Easy coincide com Business de testes:',phone.get('text')=='989677610885915' if phone.get('type')=='plain_text' else 'indeterminado')
          allowed=next((b for b in bindings if b.get('name')=='TEST_ALLOWED_WA_ID'),{})
          print('Contato teste tipo:',allowed.get('type','ausente'))
          import re
          digits=re.sub(r'\\D','',str(allowed.get('text') or '')) if allowed.get('type')=='plain_text' else ''
          print('Número autorizado de teste termina em:',digits[-4:] if len(digits)>=8 else 'não verificável')
          print('Tipos dos bindings:',sorted(set(str(x.get('type')) for x in bindings)))
          queues=[x for x in bindings if x.get('type')=='queue']
          print('Fila producer identificada:',bool(queues),'nome disponível:',all(bool(x.get('queue_name')) for x in queues))
          kv=[x for x in bindings if x.get('type')=='kv_namespace']
          print('KV completo:',bool(kv) and all(bool(x.get('namespace_id')) for x in kv))
          req=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/'+account+'/queues?per_page=100',headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=25) as response:
            qresult=json.load(response).get('result') or []
          qlist=qresult if isinstance(qresult,list) else qresult.get('queues',[])
          for q in qlist:
            consumers=q.get('consumers') or []
            if any(x.get('script_name')=='fabrika-atendimento-ia' for x in consumers):
              print('Fila original com consumidor Worker:',True,'quantidade total:',len(consumers))
          print('Nada foi alterado.')
          PY
