name: Validar KIARA (sem deploy)
on:
  push:
    branches: [homologacao]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bloquear configurações de produção
        run: |
          test ! -e wrangler.toml
          test ! -e .dev.vars
      - name: Conferir sintaxe
        run: node --check src/worker.js
      - name: Testar pausa e orientações
        run: npm test
