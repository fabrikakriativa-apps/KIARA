name: Publicar Worker Kiara - homologação isolada
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-worker-kiara-homologacao.yml'
permissions:
  contents: read
concurrency:
  group: kiara-worker-somente-homologacao
  cancel-in-progress: false
jobs:
  homologar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homologacao
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir escopo da implantação
        run: |
          test -f staging/wrangler.toml
          grep -q '^name = "fabrika-atendimento-ia-homologacao"$' staging/wrangler.toml
          grep -q '^main = "./worker.js"$' staging/wrangler.toml
          grep -q '^KIARA_DASHBOARD_ORIGIN = "https://kiara-painel-homologacao.pages.dev"          test ! -e wrangler.toml
          test ! -e .dev.vars
          test ! -e wrangler.jsonc
          grep -q 'Rota desativada na homologação isolada' staging/worker.js
          grep -q 'Sem handler de Queue' staging/worker.js
      - name: Validar sintaxe e testes de integração sem mensagens reais
        run: |
          node --check src/worker.js
          node --check staging/worker.js
          npm test
      - name: Verificar credenciais Cloudflare sem exibir valores
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Token Cloudflare indisponível"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Conta Cloudflare indisponível"; exit 1; }
      - name: Validar conta Cloudflare da Kiara antes de qualquer publicação
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          token=os.environ['CF_TOKEN']
          account=os.environ['CF_ACCOUNT']
          if not token or not account:
              raise SystemExit('Credenciais do Cloudflare não configuradas.')
          headers={'Authorization':'Bearer '+token,'Accept':'application/json'}
          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as res:
                      return res.status,json.load(res)
              except urllib.error.HTTPError as error:
                  return error.code,{}
          status,accounts=get('https://api.cloudflare.com/client/v4/accounts?per_page=100')
          if status!=200:
              raise SystemExit('Não foi possível validar conta autorizada (HTTP '+str(status)+'). Nenhum deploy.')
          if not any(a.get('id')==account for a in accounts.get('result',[])):
              raise SystemExit('Token Cloudflare pertence a outra conta: atualize a autorização do token no Cloudflare; não altere o Account ID às cegas. Nenhum deploy.')
          status,worker=get('https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/fabrika-atendimento-ia-homologacao/settings')
          if status!=200:
              raise SystemExit('Worker de homologação não localizado na conta autorizada (HTTP '+str(status)+'). Nenhum deploy.')
          print('Conta e Worker de homologação confirmados. Publicação autorizada.')
          PY
      - name: Publicar somente Worker read-only de homologação
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy --config staging/wrangler.toml
      - name: Validar binding e leitura/gravação no KV exclusivo de homologação
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, uuid
          token=os.environ['CF_TOKEN']
          account=os.environ['CF_ACCOUNT']
          base='https://api.cloudflare.com/client/v4/accounts/'+account
          headers={'Authorization':'Bearer '+token,'Accept':'application/json'}
          def call(method,url,body=None,extra=None):
              h=dict(headers)
              if extra:h.update(extra)
              req=urllib.request.Request(url,data=body,headers=h,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:
                      raw=response.read()
                      return response.status,raw
              except urllib.error.HTTPError as error:
                  return error.code,error.read()
          status,raw=call('GET',base+'/storage/kv/namespaces?per_page=100')
          if status!=200: raise SystemExit('Falha ao listar KV de homologação (HTTP '+str(status)+')')
          payload=json.loads(raw)
          matches=[x for x in payload.get('result',[]) if x.get('title')=='kiara-homologacao-controles']
          if len(matches)!=1: raise SystemExit('Namespace exclusivo ausente ou duplicado')
          namespace=matches[0]['id']
          status,raw=call('GET',base+'/workers/scripts/fabrika-atendimento-ia-homologacao/settings')
          if status!=200: raise SystemExit('Falha ao consultar bindings do Worker de homologação')
          settings=json.loads(raw).get('result') or {}
          bindings=settings.get('bindings') or []
          ok=any(b.get('type')=='kv_namespace' and b.get('name')=='KIARA_CONTROLES' and b.get('namespace_id')==namespace for b in bindings)
          if not ok: raise SystemExit('Binding KIARA_CONTROLES não aponta para o namespace exclusivo')
          key='teste-ci-'+uuid.uuid4().hex
          url=base+'/storage/kv/namespaces/'+namespace+'/values/'+key
          value=json.dumps({'environment':'homologacao','safe':True},separators=(',',':')).encode()
          try:
              status,_=call('PUT',url,value,{'Content-Type':'application/json'})
              if status not in (200,204): raise SystemExit('Falha na escrita KV (HTTP '+str(status)+')')
              status,raw=call('GET',url)
              if status!=200 or json.loads(raw)!={'environment':'homologacao','safe':True}:
                  raise SystemExit('Falha na leitura ou conteúdo divergente no KV')
              print('KV exclusivo validado: binding correto, escrita HTTP '+str(status)+' e leitura íntegra.')
          finally:
              status,_=call('DELETE',url)
              if status not in (200,204,404): raise SystemExit('Falha ao limpar chave temporária do teste')
              print('Chave temporária removida; produção não acessada.')
          PY
      - name: Confirmar simulação protegida sem enviar mensagens
        env:
          WORKER_URL: https://fabrika-atendimento-ia-homologacao.fabrikakriativa.workers.dev
          PANEL_ORIGIN: https://kiara-painel-homologacao.pages.dev
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS -H "Origin: $PANEL_ORIGIN" "$WORKER_URL/kiara/pricing/simulate")
          echo "Preflight simulação: $code"
          test "$code" = 204
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Origin: $PANEL_ORIGIN" "$WORKER_URL/kiara/pricing/simulate")
          echo "Simulação sem sessão: $code"
          test "$code" = 401
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Origin: $PANEL_ORIGIN" "$WORKER_URL/kiara/human-message")
          echo "Envio humano desativado: $code"
          test "$code" = 404
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Origin: $PANEL_ORIGIN" "$WORKER_URL/kiara/capabilities")
          echo "Diagnóstico sem autenticação: $code"
          test "$code" = 401
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS -H "Origin: $PANEL_ORIGIN" "$WORKER_URL/kiara/capabilities")
          echo "Diagnóstico CORS: $code"
          test "$code" = 204
 staging/wrangler.toml
          grep -q '^binding = "KIARA_CONTROLES"          test ! -e wrangler.toml
          test ! -e .dev.vars
          test ! -e wrangler.jsonc
          grep -q 'Rota desativada na homologação isolada' staging/worker.js
          grep -q 'Sem handler de Queue' staging/worker.js
      - name: Validar sintaxe e testes de integração sem mensagens reais
        run: |
          node --check src/worker.js
          node --check staging/worker.js
          npm test
      - name: Verificar credenciais Cloudflare sem exibir valores
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Token Cloudflare indisponível"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Conta Cloudflare indisponível"; exit 1; }
      - name: Validar conta Cloudflare da Kiara antes de qualquer publicação
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
