name: Publicar Worker Kiara - homologação isolada
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-worker-kiara-homologacao.yml'
permissions:
  contents: read
concurrency:
  group: kiara-worker-somente-homologacao
  cancel-in-progress: false
jobs:
  homologar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homologacao
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir escopo da implantação
        run: |
          test -f staging/wrangler.toml
          grep -q '^name = "fabrika-atendimento-ia-homologacao"$' staging/wrangler.toml
          grep -q '^main = "./worker.js"$' staging/wrangler.toml
          grep -q '^KIARA_DASHBOARD_ORIGIN = "https://kiara-painel-homologacao.pages.dev"$' staging/wrangler.toml
          grep -q '^binding = "KIARA_CONTROLES"$' staging/wrangler.toml
          grep -q '^binding = "CONVERSAS"$' staging/wrangler.toml
          grep -q '^id = "88c357b564b743fcbc85204ccbf5e636"$' staging/wrangler.toml
          grep -q '^binding = "KIARA_QUEUE"$' staging/wrangler.toml
          grep -q '^queue = "kiara-homologacao-respostas"$' staging/wrangler.toml
          grep -q '^KIARA_STAGING_LIVE_ENABLED = "false"$' staging/wrangler.toml
          grep -q '^KIARA_SYNC_ENABLED = "false"$' staging/wrangler.toml
          grep -q '^KIARA_CONTROL_ENABLED = "false"$' staging/wrangler.toml
          grep -q '^KIARA_HOLD_ENABLED = "false"$' staging/wrangler.toml
          grep -q '^KIARA_HUMAN_SEND_ENABLED = "false"$' staging/wrangler.toml
          grep -q '^KIARA_SYNC_ALL_CONTACTS = "false"$' staging/wrangler.toml
          test "$(grep -c '^\[\[kv_namespaces\]\]$' staging/wrangler.toml)" = 2
          test "$(grep -c '^\[\[queues.producers\]\]$' staging/wrangler.toml)" = 1
          test "$(grep -c '^\[\[queues.consumers\]\]$' staging/wrangler.toml || true)" = 0
          test -f staging/validate-kv.py
          test ! -e wrangler.toml
          test ! -e .dev.vars
          test ! -e wrangler.jsonc
          grep -q 'Rota desativada na homologação isolada' staging/worker.js
          grep -q 'Sem handler de Queue' staging/worker.js
      - name: Validar sintaxe e testes de integração sem mensagens reais
        run: |
          node --check src/worker.js
          node --check staging/worker.js
          npm test
      - name: Verificar credenciais Cloudflare sem exibir valores
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Token Cloudflare indisponível"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Conta Cloudflare indisponível"; exit 1; }
      - name: Validar conta Cloudflare da Kiara antes de qualquer publicação
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          token=os.environ['CF_TOKEN']
          account=os.environ['CF_ACCOUNT']
          if not token or not account:
              raise SystemExit('Credenciais do Cloudflare não configuradas.')
          headers={'Authorization':'Bearer '+token,'Accept':'application/json'}
          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as res:
                      return res.status,json.load(res)
              except urllib.error.HTTPError as error:
                  return error.code,{}
          status,accounts=get('https://api.cloudflare.com/client/v4/accounts?per_page=100')
          if status!=200:
              raise SystemExit('Não foi possível validar conta autorizada (HTTP '+str(status)+'). Nenhum deploy.')
          if not any(a.get('id')==account for a in accounts.get('result',[])):
              raise SystemExit('Token Cloudflare pertence a outra conta: atualize a autorização do token no Cloudflare; não altere o Account ID às cegas. Nenhum deploy.')
          status,worker=get('https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/fabrika-atendimento-ia-homologacao/settings')
          if status!=200:
              raise SystemExit('Worker de homologação não localizado na conta autorizada (HTTP '+str(status)+'). Nenhum deploy.')
          print('Conta e Worker de homologação confirmados. Publicação autorizada.')
          PY
      - name: Publicar ponte INATIVA do Worker de homologação sem integração WhatsApp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy --config staging/wrangler.toml
      - name: Validar binding e leitura/gravação no KV exclusivo de homologação
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 staging/validate-kv.py
      - name: Confirmar controles simulados e bloqueio de mensagens reais
        env:
          WORKER_URL: https://fabrika-atendimento-ia-homologacao.fabrikakriativa.workers.dev
          PANEL_ORIGIN: https://kiara-painel-homologacao.pages.dev
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS -H "Origin: $PANEL_ORIGIN" "$WORKER_URL/kiara/pricing/simulate")
          echo "Preflight simulação: $code"
          test "$code" = 204
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Origin: $PANEL_ORIGIN" "$WORKER_URL/kiara/pricing/simulate")
          echo "Simulação sem sessão: $code"
          test "$code" = 401
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS -H "Origin: $PANEL_ORIGIN" "$WORKER_URL/kiara/control")
          echo "Preflight controle simulado: $code"
          test "$code" = 204
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X GET -H "Origin: $PANEL_ORIGIN" "$WORKER_URL/kiara/control")
          echo "Controle sem sessão: $code"
          test "$code" = 401
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Origin: $PANEL_ORIGIN" "$WORKER_URL/kiara/control")
          echo "Alteração sem sessão: $code"
          test "$code" = 401
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X GET -H "Origin: https://attacker.example" "$WORKER_URL/kiara/control")
          echo "Origem não autorizada: $code"
          test "$code" = 403
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS -H "Origin: $PANEL_ORIGIN" "$WORKER_URL/kiara/coach")
          echo "Preflight segurar/liberar simulado: $code"
          test "$code" = 204
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Origin: $PANEL_ORIGIN" "$WORKER_URL/kiara/coach")
          echo "Segurar sem sessão: $code"
          test "$code" = 401
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Origin: $PANEL_ORIGIN" "$WORKER_URL/kiara/human-message")
          echo "Envio humano desativado: $code"
          test "$code" = 404
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Origin: $PANEL_ORIGIN" "$WORKER_URL/kiara/capabilities")
          echo "Diagnóstico sem autenticação: $code"
          test "$code" = 401
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS -H "Origin: $PANEL_ORIGIN" "$WORKER_URL/kiara/capabilities")
          echo "Diagnóstico CORS: $code"
          test "$code" = 204

# 2ª etapa homologação: observar comandos e retenção somente no KV separado.
