          token=os.environ['CF_TOKEN']
          account=os.environ['CF_ACCOUNT']
          if not token or not account:
              raise SystemExit('Credenciais do Cloudflare não configuradas.')
          headers={'Authorization':'Bearer '+token,'Accept':'application/json'}
          def get(url):
