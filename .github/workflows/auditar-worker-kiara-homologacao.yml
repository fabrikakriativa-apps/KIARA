name: Auditar pré-requisitos Worker Kiara - sem publicar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auditar-worker-kiara-homologacao.yml'
permissions:
  contents: read
jobs:
  auditoria:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verificar componentes Cloudflare da homologação (somente metadados)
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          account=os.environ.get('CF_ACCOUNT','')
          token=os.environ.get('CF_TOKEN','')
          if not account or not token: raise SystemExit('Faltam credenciais de auditoria Cloudflare')
          api='https://api.cloudflare.com/client/v4/accounts/'+account
          def fetch(path):
              req=urllib.request.Request(api+path,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:
                      return response.status,json.load(response)
              except urllib.error.HTTPError as e:
                  return e.code,{}
          for worker in ('fabrika-atendimento-ia-homologacao',):
              status,data=fetch('/workers/scripts/'+worker+'/settings')
              if status!=200:
                  print('Worker '+worker+': consulta de bindings indisponível (HTTP '+str(status)+')')
                  continue
              bindings=(data.get('result') or {}).get('bindings') or []
              kind=lambda t:sum(1 for b in bindings if b.get('type')==t)
              print('Worker '+worker+': bindings de armazenamento KV='+str(kind('kv_namespace'))+
                    ', fila='+str(kind('queue'))+', secrets='+str(kind('secret_text'))+
                    ', variáveis='+str(kind('plain_text')))
              haskv=any(b.get('type')=='kv_namespace' and b.get('name')=='CONVERSAS' for b in bindings)
              hasqueue=any(b.get('type')=='queue' for b in bindings)
              print('CONVERSAS presente:',haskv)
              print('Fila de mensagens presente:',hasqueue)
              print('Transportes Meta/OpenAI: NÃO validados por este diagnóstico (somente metadados)')
          status,data=fetch('/storage/kv/namespaces?per_page=100')
          if status==200:
              resources=data.get('result') or []
              print('Namespaces KV no total da conta:',len(resources),'(não altera nem cria)')
          else:print('Consulta namespaces KV indisponível, HTTP',status)
          status,data=fetch('/queues?per_page=100')
          if status==200:
              result=data.get('result') or []
              qs=result if isinstance(result,list) else result.get('queues') or []
              print('Filas na conta:',len(qs),'(não altera nem cria)')
          else:print('Consulta filas indisponível, HTTP',status)
          PY
