name: Publicar SOMENTE Worker de homologacao

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-homologacao.yml'

permissions:
  contents: read

concurrency:
  group: kiara-homologacao-smoke
  cancel-in-progress: false

jobs:
  publicar-homologacao:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código da homologação
        uses: actions/checkout@v4
        with:
          ref: homologacao

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar isolamento e executar testes
        run: |
          test -f staging/wrangler.toml
          grep -Fxq 'name = "fabrika-atendimento-ia-homologacao"' staging/wrangler.toml
          grep -Fxq 'main = "./worker.js"' staging/wrangler.toml
          grep -Fxq 'workers_dev = true' staging/wrangler.toml
          test -f staging/worker.js
          test -f src/worker.js
          ! grep -Eq '^\s*(routes?|account_id|kv_namespaces|queues|services)\s*=' staging/wrangler.toml
          ! grep -Eq '^\s*\[\[(kv_namespaces|queues|services)' staging/wrangler.toml
          node --check staging/worker.js
          node --check src/worker.js
          npm test

      - name: Confirmar Worker isolado existente
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          a=os.environ.get('CF_ACCOUNT','')
          t=os.environ.get('CF_TOKEN','')
          if len(a)!=32 or not all(c in '0123456789abcdef' for c in a.lower()) or not t:
              raise SystemExit('Credenciais de Cloudflare ausentes ou inválidas.')
          req=urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/scripts',headers={'Authorization':'Bearer '+t,'Accept':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=20) as res: data=json.load(res)
          except Exception:
              raise SystemExit('Não foi possível consultar os Workers. Nenhum deploy realizado.') from None
          if not data.get('success'):
              raise SystemExit('Token sem autorização. Nenhum deploy realizado.')
          names=[r.get('id') for r in data.get('result',[]) if isinstance(r,dict)]
          if 'fabrika-atendimento-ia-homologacao' not in names:
              raise SystemExit('Worker de homologação não encontrado. Nenhum deploy realizado.')
          print('Worker separado confirmado.')
          PY

      - name: Publicar apenas homologação
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config staging/wrangler.toml

      - name: Confirmar health, sessão obrigatória e bloqueio de webhook (HTTP real)
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          base='https://fabrika-atendimento-ia-homologacao.fabrikakriativa.workers.dev'
          with urllib.request.urlopen(base+'/health',timeout=20) as res:
            info=json.load(res)
          assert info.get('status')=='ok',info
          assert info.get('external_integrations')=='blocked',info
          assert info.get('supabase_read')=='authenticated_only',info
          def check(path,status,method='GET',headers=None):
            req=urllib.request.Request(base+path,method=method,headers=headers or {})
            try:
              with urllib.request.urlopen(req,timeout=20) as res:
                obtained=res.status
            except urllib.error.HTTPError as e:
              obtained=e.code
            assert obtained==status, f'{path}: expected {status}, got {obtained}'
          check('/kiara/coach?conversationId=5453d08e-eb3f-4699-8d77-16d5da956aaf',403)
          check('/kiara/coach?conversationId=5453d08e-eb3f-4699-8d77-16d5da956aaf',401,headers={'Origin':'https://fabrikakriativa-apps.github.io'})
          check('/webhook',404,method='POST')
          check('/kiara/coach',404,method='POST')
          print('SMOKE_OK: Worker isolado, autenticação exigida e envios bloqueados.')
          PY
