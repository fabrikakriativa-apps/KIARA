# HOMOLOGAÇÃO isolada: Worker real importado sem webhook ou queue; KV exclusivo apenas para controles de teste.
name = "fabrika-atendimento-ia-homologacao"
main = "./worker.js"
compatibility_date = "2026-11-02"
workers_dev = true

[vars]
SUPABASE_URL = "https://dpowbyexrcdcwwqysgzp.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_5R2zVzcZQVAGGd72zXayFQ_zCp_tJkU"
KIARA_DASHBOARD_ORIGIN = "https://kiara-painel-homologacao.pages.dev"
SUPABASE_ORGANIZATION_ID = "0e398095-cc22-421b-ae34-7bf0df8ad7b2"
# Número Business de homologação já conectado no EasyCoexistence (ID fornecido pela Meta).
# A ponte permanece bloqueada até configurar os segredos exclusivos, consumidor da fila e destino do webhook.
KIARA_STAGING_PROVIDER = "easy"
EASY_PHONE_NUMBER_ID = "989677610885915"
KIARA_STAGING_LIVE_ENABLED = "true"
KIARA_CUSTOMER_QUALIFICATION_ENABLED = "true"
KIARA_SYNC_ENABLED = "true"
KIARA_CONTROL_ENABLED = "true"
KIARA_HOLD_ENABLED = "true"
KIARA_HUMAN_SEND_ENABLED = "false"
# Pré-orçamentos restritos à conversa e à revisão humana, sem envio automático.
KIARA_BUDGET_WORKFLOW_ENABLED = "true"
# Simulador autenticado apenas para equipe autorizada no painel de testes.
KIARA_QUOTE_SIMULATION_ENABLED = "true"
KIARA_SYNC_ALL_CONTACTS = "false"
KIARA_ADS_ROUTING_ENABLED = "true"

[[kv_namespaces]]
binding = "KIARA_CONTROLES"
id = "64e0916fb8a04a2ca75b0220f1fb991b"

[[kv_namespaces]]
binding = "CONVERSAS"
id = "88c357b564b743fcbc85204ccbf5e636"

[[queues.producers]]
binding = "KIARA_QUEUE"
queue = "kiara-homologacao-respostas"

[[queues.consumers]]
queue = "kiara-homologacao-respostas"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
