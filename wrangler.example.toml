# EXEMPLO — não executar deploy com esta configuração.
# Copie somente após comparar o Worker de produção e confirmar bindings.
name = "fabrika-atendimento-ia-homologacao"
main = "src/worker.js"
compatibility_date = "2026-11-02"

[vars]
KIARA_HOLD_ENABLED = "false"
KIARA_GUIDANCE_ENABLED = "false"
KIARA_CONTROL_ENABLED = "false"
KIARA_SYNC_ALL_CONTACTS = "false"
KIARA_AUDIO_MODE = "off" # off | review (sempre humano) | reply (somente caso claro)
KIARA_AUDIO_REVIEW_MODEL = "gpt-4.1-mini"
RESPONSE_DELAY_SECONDS = "15"

# Configurar KV, Queue e demais variáveis usando recursos isolados de teste.
# Ativar audio somente depois de conferir permissao de download de midia da API WhatsApp.
# Em caso de duvida, falha, fonte insegura ou transcricao pouco confiavel, pausa e encaminha para humano.
# Nunca colocar segredos META_*, EASY_*, OPENAI_API_KEY ou SUPABASE_SERVICE_ROLE_KEY no GitHub.
